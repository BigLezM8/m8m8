<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M8M8</title>
<meta name="description" content="M8M8: stack crates, unbox a mob, flatten their base. Play solo or with up to 4 mates.">
<meta property="og:title" content="M8M8">
<meta property="og:description" content="Stack crates, unbox a mob, flatten their base.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: full-bleed canvas arena; HUD panels and menus float over it. M8M8 tokens: warm cream ground, ink outlines,
   soft-block corners, dark panels with LED-lime seven-segment numbers. */
:root{
  --ink:#1b1626; --cream:#fff8ec; --paper:#f4ead8; --muted:#6b6175; --panel:#221c30; --boot:#2e2640;
  --chilli:#ff5530; --chilli-s:#c93a1d; --sherbet:#ff8ccf; --custard:#ffd23f; --custard-s:#d39f0f; --teal:#20c4b0; --teal-s:#11897a;
  --lime:#c8ff3c; --fume:#ff5a2e; --chill:#5ee3ff; --cone:#ff7a1a;
  --blue:var(--teal); --red:var(--chilli); --gold:var(--custard); --wood:#d9a04e; --leaf:#15121c;
  --r-sm:8px; --r-md:16px; --r-lg:28px;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--leaf);color:var(--ink);font-family:var(--body);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
input,select{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}

#hud{position:fixed;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start;pointer-events:none}
.panel{background:var(--panel);color:var(--cream);border:3px solid var(--ink);border-radius:var(--r-md);box-shadow:0 4px 0 var(--ink);padding:7px 12px 8px}
.side{width:100%}
.dock{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(372px,calc(100vw - 24px));padding:10px 10px 6px;display:flex;flex-direction:column;gap:7px;pointer-events:auto;border-radius:var(--r-lg)}
.dock.touch{bottom:auto;top:var(--padtop,140px);width:min(340px,calc(58vw - 24px));padding:8px 8px 4px}
.dock.touch:not(.open){width:auto;padding:6px;gap:0;border-radius:var(--r-md)}
.dock.touch:not(.open) .dk-strip,.dock.touch:not(.open) .dk-head{display:none}
.dock.touch:not(.open) .dk-pad,.dock.touch:not(.open) .dk-pad canvas{width:62px;height:62px}
.dock.touch:not(.open) .dk-pad .cnt{height:16px;padding:2px 3px}
.dock.touch:not(.open) .dk-rcpt{width:132px;flex:none}
.dock.touch:not(.open) .paper{padding:5px 6px 4px}
.dock.touch:not(.open) .paper b{font-size:13px}
.dock.touch:not(.open) .paper small,.dock.touch:not(.open) .paper .ln span:last-child{display:none}
.dock.touch:not(.open) .paper .ln{margin-top:3px;padding-top:3px}
.dock.pulse{animation:dkpulse .5s ease-out}
@keyframes dkpulse{0%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(200,255,60,.9)}100%{box-shadow:0 4px 0 var(--ink),0 0 0 18px rgba(200,255,60,0)}}
.dk-top{display:flex;gap:10px;align-items:stretch}
.dk-pad{position:relative;flex:none;width:108px;height:108px}
.dk-pad canvas{width:108px;height:108px;display:block}
.dk-pad .cnt{position:absolute;right:-4px;bottom:-4px;background:var(--ink);border:2px solid var(--panel);border-radius:8px;height:22px;padding:3px 5px;display:flex}
.dk-pad .cnt svg{height:100%;width:auto}
.dk-pad .cnt .on{fill:var(--lime)} .dk-pad .cnt .off{fill:var(--lime);opacity:.1}
.dk-rcpt{flex:1;min-width:0;display:flex;flex-direction:column}
.dk-rcpt .pslot{height:8px;background:#15121c;border-radius:4px;box-shadow:inset 0 3px 0 #000;position:relative;z-index:1}
.paper{position:relative;margin:-3px 7px 8px;background:#fffdf6;color:var(--ink);padding:9px 9px 7px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.paper::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(135deg,#fffdf6 50%,transparent 50%) 0 0/8px 8px repeat-x,linear-gradient(225deg,#fffdf6 50%,transparent 50%) 0 0/8px 8px repeat-x}
.paper.print{animation:print .45s steps(7,end)}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -10px 0)}}
.paper small{display:block;font:800 9.5px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.paper b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.02;margin-top:2px;overflow-wrap:anywhere}
.paper .ln{border-top:1.5px dashed rgba(27,22,38,.3);margin-top:6px;padding-top:5px;display:flex;gap:6px;justify-content:space-between;align-items:center;font:800 10px/1.2 ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.paper .mats{display:flex;gap:3px}
.paper .dot{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--ink);display:inline-block}
.paper kbd{background:var(--ink);color:var(--lime);border:0;font-size:10px;padding:1px 5px}
.paper .go{color:var(--chilli-s)}
.paper .stamp{position:absolute;right:4px;top:6px;transform:rotate(-12deg);border:3px solid var(--chilli);color:var(--chilli);font-family:var(--display);font-size:17px;padding:1px 6px;border-radius:7px;background:rgba(255,253,246,.85);animation:stamp .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.paper.shake{animation:pshake .12s linear infinite}
@keyframes pshake{0%,100%{transform:translate(0,0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
.dk-head{display:flex;align-items:center;gap:6px;font:900 10px/1 var(--body);letter-spacing:.08em;color:#b8adc4;padding:0 2px}
.dk-head b{font-family:var(--display);font-size:16px;font-weight:400;color:var(--lime);letter-spacing:.02em}
.dk-head em{font-style:normal;color:#e9ddc8;font-size:10px}
.dk-head .pips{margin-left:auto;display:flex;gap:3px}
.dk-head .pips i{width:9px;height:9px;border-radius:3px;background:#4a4060}
.dk-head .pips i.on{background:var(--lime);box-shadow:0 0 6px rgba(200,255,60,.6)}
.dk-head kbd{background:var(--lime);color:var(--ink);border:0;font-size:10px;padding:1px 5px}
.dk-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:5px 12px 6px;margin:0 -10px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.dk-strip::-webkit-scrollbar{display:none}
.bcard{flex:none;width:64px;position:relative;background:var(--boot);border:2px solid #3d3352;border-radius:14px;padding:3px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--cream);transition:transform .12s,background .12s,border-color .12s}
.bcard canvas{width:58px;height:54px;display:block}
.bcard .nm{font-family:var(--display);font-size:11px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.bcard .shp{display:grid;grid-template-columns:repeat(2,8px);gap:1.5px;position:absolute;right:4px;top:4px}
.bcard .shp i{width:8px;height:8px;border-radius:2px;background:rgba(255,248,236,.12)}
.bcard .shp i.h1{background:#e8c27a}.bcard .shp i.h2{background:#d9a04e;box-shadow:inset 0 -3px 0 #9a6a35}.bcard .shp i.h3{background:#b8792f;box-shadow:inset 0 -5px 0 #6b4a24}
.bcard .bd{position:absolute;left:4px;top:4px;font:900 9px/1 var(--body);background:var(--lime);color:var(--ink);border-radius:5px;padding:2px 4px}
.bcard .bd.now{background:var(--custard)}
.bcard .bar{position:absolute;left:7px;right:7px;bottom:3px;height:3px;border-radius:2px;background:rgba(0,0,0,.35);overflow:hidden;display:none}
.bcard .bar b{display:block;height:100%;background:var(--ink)}
.bcard:hover{transform:translateY(-2px);border-color:#5a4e72}
.bcard.dim{opacity:.5}
.bcard.dim:hover{opacity:.85}
.bcard.pick{border-color:var(--lime);border-style:dashed}
.bcard.sel{background:var(--lime);border-color:var(--ink);color:var(--ink);transform:translateY(-4px);box-shadow:0 4px 0 var(--ink);opacity:1}
.bcard.sel .bar,.bcard.pick .bar{display:block}
.bcard.pick .bar b{background:var(--lime)}
.bcard.sel .shp i{background:rgba(27,22,38,.15)}
.bcard.sel .shp i.h1,.bcard.sel .shp i.h2,.bcard.sel .shp i.h3{background:var(--ink);box-shadow:none}
.lcol{display:flex;flex-direction:column;gap:8px;width:min(300px,100%);min-width:0}
.side.r{justify-self:end}
.lbl{font-family:var(--display);font-size:13px;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
.lbl span{overflow:hidden;text-overflow:ellipsis}
.hpbar{height:12px;border:2px solid var(--ink);border-radius:var(--r-sm);background:var(--boot);overflow:hidden;margin-top:4px;display:flex}
.hpbar i{display:block;height:100%;transition:width .15s}
.hpbar.mini{height:9px;margin-top:0;flex:1;min-width:40px}
.sub{font-size:12px;margin-top:4px;font-weight:800;letter-spacing:.04em;color:#e9ddc8;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:11px;letter-spacing:.04em;white-space:nowrap}
.trow+.trow{margin-top:4px}
.trow .dot{width:11px;height:11px;border-radius:3px;border:2px solid var(--ink);flex:none}
.trow em{font-style:normal;font-family:var(--body);font-weight:800;font-size:10px;min-width:58px;text-align:right}
.trow.out{opacity:.4;text-decoration:line-through}
.mid{display:flex;flex-direction:column;align-items:center;gap:4px}
#timer{height:34px;background:var(--panel);border:3px solid var(--ink);border-radius:var(--r-md);box-shadow:0 4px 0 var(--ink);padding:6px 12px;display:flex;align-items:center}
#timer svg{display:block;height:100%;width:auto;overflow:visible}
#timer .on{fill:var(--lime);filter:drop-shadow(0 0 3px rgba(200,255,60,.55))}
#timer .off{fill:var(--lime);opacity:.08}
#timer.hot .on{fill:var(--fume);filter:drop-shadow(0 0 3px rgba(255,90,46,.6))}
#timer.hot .off{fill:var(--fume)}
#roundLbl{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--cream);background:var(--ink);padding:2px 10px;border-radius:999px;white-space:nowrap}
.minibtns{display:flex;gap:6px;pointer-events:auto}
.minibtns button{background:var(--cream);border:2px solid var(--ink);border-radius:var(--r-sm);box-shadow:0 2px 0 var(--ink);font-family:var(--display);font-size:12px;padding:3px 9px}
#hint{position:fixed;left:calc(50% + 196px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;max-width:calc(100% - 420px);flex-wrap:wrap;justify-content:center}
@media (max-width:860px){#hint{left:50%;max-width:calc(100% - 32px);bottom:calc(env(safe-area-inset-bottom,0px) + 250px)}}
#hint span{background:var(--panel);color:var(--cream);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}
#hint kbd{font-family:var(--display);background:var(--cream);color:var(--ink);border-radius:5px;padding:0 6px;margin-right:6px;font-size:12px;border:0}
#hint .tip{background:var(--custard);color:var(--ink)}
#netbar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--panel);color:var(--lime);font-weight:800;font-size:12px;padding:5px 10px;border-radius:20px;pointer-events:none}

#banner{position:fixed;left:0;right:0;top:13%;text-align:center;pointer-events:none;opacity:0;padding-inline:16px}
#banner b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(26px,4.6vw,50px);line-height:1;color:var(--cream);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);text-wrap:balance}
#banner span{display:inline-block;margin-top:10px;background:var(--panel);color:var(--cream);font-weight:800;padding:5px 14px;border-radius:20px;font-size:14px}
#banner.show{animation:bannerPop 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bannerPop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}12%{opacity:1;transform:scale(1.08) rotate(-2deg)}22%{transform:scale(1) rotate(-2deg)}80%{opacity:1;transform:scale(1) rotate(-2deg)}100%{opacity:0;transform:scale(.95) translateY(-20px) rotate(-2deg)}}

#find{position:fixed;right:max(16px,env(safe-area-inset-right,0px));left:auto;top:calc(env(safe-area-inset-top,0px) + 280px);transform:none;max-width:min(360px,calc(100vw - 32px));pointer-events:none;display:flex;gap:12px;align-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:var(--r-md);box-shadow:0 5px 0 var(--ink);padding:8px 16px 8px 8px;opacity:0;max-width:calc(100% - 32px)}
#find canvas{width:64px;height:64px;background:var(--paper);border-radius:var(--r-sm);border:2px solid var(--ink);flex:none}
#find small{display:block;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--chilli-s)}
#find b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1}
#find span{display:block;font-size:12px;font-weight:600}
#find.show{animation:findPop 3.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes findPop{0%{opacity:0;transform:translateX(40px) scale(.9)}10%{opacity:1;transform:translateX(0) scale(1.03)}16%{transform:translateX(0) scale(1)}88%{opacity:1}100%{opacity:0;transform:translateX(20px)}}

#touch{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:230px;height:220px;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;border:3px solid var(--ink);border-radius:50%;box-shadow:3px 4px 0 var(--ink);font-family:var(--display);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;touch-action:none;padding:2px}
#touch button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
#bGrab{right:0;bottom:0;width:90px;height:90px;background:var(--gold);font-size:13px}
#bBuild{right:98px;bottom:4px;width:74px;height:74px;background:var(--cream);font-size:11px}
#bBuild small{display:block;font-size:8px;margin-top:3px;font-family:var(--body);font-weight:800;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bBuild.ready{background:var(--lime)}
#bHop{right:4px;bottom:100px;width:54px;height:54px;background:var(--sherbet);font-size:10px}
#bSwap{right:64px;bottom:118px;width:50px;height:50px;background:var(--cream);font-size:10px}
#bOrder{right:120px;bottom:90px;width:50px;height:50px;background:var(--teal);color:var(--ink);font-size:9px}
#bShout{right:176px;bottom:24px;width:46px;height:46px;background:var(--red);color:var(--cream);font-size:12px}
#bAbil{right:182px;bottom:84px;width:58px;height:58px;background:var(--custard,#e3b54f);color:var(--ink);font-size:9px}
#bAbil.cool{opacity:.45}
.ups{display:flex;gap:5px;margin-top:6px}.ups .up{flex:1;font-style:normal;text-align:center;font-family:var(--display);font-size:10px;letter-spacing:.04em;padding:2px 0;border-radius:8px;border:1.5px dashed rgba(255,248,232,.25);color:rgba(255,248,232,.4)}.ups .up.on{border:0;background:var(--uc);color:#fffaf0;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.abil{position:relative;margin-top:6px;height:22px;border-radius:11px;background:rgba(0,0,0,.28);overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 10px;font-family:var(--display);font-size:11px;letter-spacing:.05em}
.abil i{position:absolute;left:0;top:0;bottom:0;background:var(--abc,#e3b54f);opacity:.85;border-radius:11px;transition:width .1s linear}
.abil b,.abil kbd{position:relative;font-weight:400}
.abil kbd{font-family:var(--body);font-size:9px;font-weight:800;background:rgba(0,0,0,.35);border-radius:8px;padding:1px 6px}
.abil.ready b{color:#221c30}
.abil.riot i{background:linear-gradient(90deg,#d8705c,#ffb07a)}.abil.riot.ready{animation:riotPulse .8s ease-in-out infinite alternate}
@keyframes riotPulse{from{box-shadow:0 0 0 0 rgba(255,176,122,.0)}to{box-shadow:0 0 0 3px rgba(255,176,122,.75)}}
#bUlt{right:250px;bottom:20px;width:64px;height:64px;background:linear-gradient(#ffb07a,#d8705c);color:#fffaf0;font-size:10px}
#bPlan{right:150px;bottom:150px;width:58px;height:58px;background:var(--lime);color:var(--ink);font-size:9px}

#screen{position:fixed;inset:0;background:rgba(27,22,38,.6);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- title: live arena behind, tribes on stage, three big buttons ---- */
#screen.title{background:radial-gradient(ellipse 80% 70% at 50% 52%,rgba(27,22,38,.18),rgba(27,22,38,.62) 78%,rgba(27,22,38,.82));-webkit-backdrop-filter:blur(4px) saturate(.8);backdrop-filter:blur(4px) saturate(.8);align-items:stretch}
.ttl{width:min(1120px,100%);margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(8px,2vh,20px)}
.ttl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ttl .logo{gap:4px}.ttl .logo .m8{font-size:clamp(52px,7.5vw,92px);color:#e8795f;-webkit-text-stroke:0;text-shadow:0 2px 0 #b9584a,0 5px 0 #9a473c,0 10px 18px rgba(0,0,0,.35)}
.ttl .logo .sub{font-size:clamp(12px,1.6vw,16px);background:rgba(27,22,38,.72);color:#fff3dc;padding:5px 10px;border-radius:999px;letter-spacing:.18em}
.ttl-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:rgba(27,22,38,.72);border-radius:999px;padding:4px;gap:2px;backdrop-filter:blur(6px)}
.seg .dbtn{border:0;background:transparent;color:#fff3dc;padding:6px 13px;font-size:13px}
.seg .dbtn.on{background:#fff8ec;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.chip{font-family:var(--display);font-size:13px;letter-spacing:.04em;background:#fff8ec;color:var(--ink);border:0;border-radius:999px;padding:8px 14px;box-shadow:0 3px 0 rgba(27,22,38,.45),0 6px 14px rgba(0,0,0,.18);cursor:pointer}
.chip b{font-weight:400;color:#c86a52}
.chip:hover{transform:translateY(-1px)}
.stage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,2vw,26px);align-items:end;flex:1;min-height:0;padding-top:2vh}
.tribe{position:relative;background:none;border:0;padding:0 0 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#fff8ec;min-width:0}
.tribe canvas{position:relative;z-index:1;width:100%;max-width:230px;max-height:min(38vh,300px);height:auto;aspect-ratio:260/300;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28)) saturate(.75) brightness(.92);opacity:.78;transform:scale(.86) translateY(6px);transition:transform .3s cubic-bezier(.2,1.5,.4,1),opacity .2s,filter .2s}

const AGGRO=430;
function steer(u,tx,ty,mul=1){

  const [wx,wy]=navDir(u,tx,ty,1/60);
  let dx=wx-u.x, dy=wy-u.y; { const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l; }

  const ahead=u.r+30;

    const base=Math.atan2(dy,dx);

    }

}
function woundedAlly(u,maxd){ let best=null,bh=1; for(const v of G.units){ if(v.dead||v.hidden||v.team!==u.team||v===u||v.structure) continue; const f=v.hp/v.maxhp; if(f<0.9&&f<bh&&d2(u,v)<maxd*maxd){bh=f;best=v;} } return best; }
function teamTarget(t){

function ai(u,dt){

function findCrate(u){

function navDir(u,tx,ty,dt){

  u.pathT=(u.pathT||0)-(dt||0.016);

  const w=Math.max(24,ctx.measureText(s.text).width+12), hFull=Math.round(19*sz), h=hFull*Math.max(0.25,feed);

/* banners queue up instead of drawing over each other */
const BQ={q:[],until:0,t:null};
function banner(big,small,col){
  const now=performance.now();
  if(now<BQ.until){ if(!BQ.q.some(b=>b[0]===big)&&BQ.q.length<3) BQ.q.push([big,small,col]); if(!BQ.t) BQ.t=setTimeout(bannerNext,BQ.until-now+40); return; }
  showBanner(big,small,col);
}
function bannerNext(){ BQ.t=null; const n=BQ.q.shift(); if(n) showBanner(...n); if(BQ.q.length) BQ.t=setTimeout(bannerNext,BQ.until-performance.now()+40); }
function showBanner(big,small,col){
  BQ.until=performance.now()+1150;
  const el=$('banner'); el.innerHTML='';
  const b=document.createElement('b'); b.textContent=big; if(col) b.style.color=col; el.appendChild(b);
  if(small){ const s=document.createElement('span'); s.textContent=small; el.appendChild(document.createElement('br')); el.appendChild(s); }
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

  $('nick').onchange=()=>{ if(NET.api) NET.api.presence({nick:myNick()}).catch(()=>{}); };
  $('hGo').onclick=()=>{ store.set('nick',cleanNick($('nick').value)); resetRun($('hMode').value); netHost($('hMode').value,$('hMap').value,DIFF); };
  $('jGo').onclick=()=>{ store.set('nick',cleanNick($('nick').value)); netJoin($('jCode').value); };
  $('oBack').onclick=titleScreen;
  renderGamesList();
}
function renderGamesList(){
  const el=$('games'); if(!el) return;
  const list=(NET.lobbyPeers||[]).filter(p=>!p.isMe&&p.presence&&p.presence.host&&p.presence.host.code);
  if(!NET.api){ el.innerHTML='<p class="note">Open games show up here when online play is available.</p>'; return; }
  if(NET.api.peer){ el.innerHTML='<p class="note">Type the code your mate sent you, or open their invite link.</p>'; return; }
  if(!list.length){ el.innerHTML='<p class="note">No open games right now. Host one, or type a code.</p>'; return; }
  el.innerHTML=list.map(p=>{ const h=p.presence.host, full=(h.n||1)>=4, playing=h.st&&h.st!=='wait';
    return `<div class="gamerow"><span>${esc(cleanNick(p.presence.nick))} · ${h.mode==='ffa'?'Free-for-all':'Co-op'} · ${h.n||1}/4${playing?' · in game':''}</span><button class="ghost" data-code="${esc(h.code)}" ${full||(playing&&h.mode==='ffa')?'disabled':''}>JOIN</button></div>`; }).join('');
  el.querySelectorAll('button[data-code]').forEach(b=>b.onclick=()=>{ store.set('nick',cleanNick(($('nick')||{}).value||myNick())); netJoin(b.dataset.code); });
}
function waitingScreen(){
  state='lobby'; setPlayUI(false); titleBackdrop();
  const g=NET.g||{}, host=NET.role==='host';
  const slots=[0,1,2,3].map(s=>{ const nick=(g.nicks||{})[s]; const col=g.mode==='ffa'?TEAM_COLS[s].acc:PCOLS[s];
    return nick?`<div class="slot"><i style="background:${col}"></i><span>${esc(nick)}${s===0?' · host':''}</span></div>`:`<div class="slot empty"><i style="background:transparent"></i><span>Open slot${g.mode==='ffa'?' · bot team':''}</span></div>`; }).join('');
  showScreen(`<div class="card">
    <div class="eyebrow">${host?'YOU ARE HOSTING':'JOINED'} · ${g.mode==='ffa'?'FREE-FOR-ALL':'CO-OP VS THE CHIEF'}</div>
    <div class="code" aria-label="Game code">${esc(String(NET.code||'').toUpperCase())}</div>
    <p class="note">${host?(NET.api&&NET.api.peer?'Send your mates the invite link, or tell them the code. Up to 4 players.':'Tell your mates this code. They open this page on claude.ai, go to Online and join. Up to 4 players.'):'Waiting for the host to start the game.'} Map: ${g.theme==='rotate'?'rotates each round':g.theme==='random'?'random':esc(THEMES[g.theme]?THEMES[g.theme].name:'')}. Difficulty: ${esc(DIFFS[g.diff]?DIFFS[g.diff].name:'')}.</p>
    <div class="slots">${slots}</div>
    <div class="row">${host?'<button class="big hot" id="wStart">START</button>':''}${host&&NET.api&&NET.api.peer?'<button class="ghost" id="wLink">COPY INVITE LINK</button>':''}<button class="ghost" id="wLeave">LEAVE</button></div>
  </div>`);
  if(host) $('wStart').onclick=()=>{ RUN.round=RUN.round||1; hostStart(); };
  if($('wLink')) $('wLink').onclick=()=>{ const url=location.origin+location.pathname+'?join='+NET.code; try{ navigator.clipboard.writeText(url).then(()=>{ $('wLink').textContent='LINK COPIED'; },()=>prompt('Invite link',url)); }catch(e){ prompt('Invite link',url); } };
  $('wLeave').onclick=()=>netLeave(false);
}
function hostPerkScreen(ids){
  showScreen(`<div class="card"><div class="eyebrow">ROUND ${RUN.round} CLEARED · YOU HOST, YOU PICK</div><h2>Pick one perk for the whole team</h2>${statsHTML(G.stats)}${findsHTML()}${perkCards(ids,true)}${ownedHTML()}</div>`);
  document.querySelectorAll('.perk').forEach(b=>b.onclick=()=>{ const id=b.dataset.id; RUN.perks[id]=(RUN.perks[id]||0)+1; RUN.round++; hostStart(); });
}
function clientPerkScreen(g){
  showScreen(`<div class="card"><div class="eyebrow">ROUND ${g.round||RUN.round} CLEARED</div><h2>The host is picking a perk</h2>${statsHTML(g.stats||{})}${findsHTML()}${perkCards(g.choices||[],false)}${ownedHTML()}<div class="row"><button class="ghost" id="wLeave">LEAVE</button></div></div>`);
  $('wLeave').onclick=()=>netLeave(false);
}
function resultsScreen(res,client){
  const win=res.mode==='ffa'?(G&&res.winner===myTeam()):res.result==='win';
  const title=res.mode==='ffa'?(res.winnerName?`${res.winnerName} wins`:'Nobody wins'):(res.result==='win'?'You flattened them':`Run over at round ${res.round}`);
  const pl=(res.players||[]).map(p=>`<span>${esc(p.nick)} · ${p.kills} kills</span>`).join('');
  showScreen(`<div class="card"><div class="eyebrow">${res.mode==='ffa'?'FREE-FOR-ALL':'CO-OP'} · ${win?'VICTORY':'GAME OVER'}</div><h2>${esc(title)}</h2>
    <div class="statline">${pl}</div>${findsHTML()}
    <div class="row">${client?'<p class="note">Waiting for the host.</p>':`<button class="big" id="rAgain">${res.mode==='ffa'?'REMATCH':'NEW RUN'}</button><button class="ghost" id="rLobby">BACK TO LOBBY</button>`}<button class="ghost" id="rLeave">LEAVE</button></div></div>`);
  if(!client){ $('rAgain').onclick=()=>{ resetRun(NET.g.mode); hostStart(); }; $('rLobby').onclick=()=>{ resetRun(NET.g.mode); G=null; gPatch({st:'wait',res:null}); lobbyAd(); waitingScreen(); }; }
  $('rLeave').onclick=()=>netLeave(false);
}

/* ================= EVENTS ================= */
const KEYACT={KeyX:'ult',ShiftLeft:'ability',ShiftRight:'ability',KeyG:'ability',KeyE:'grab',Space:'grab',KeyF:'build',KeyB:'build',KeyR:'hop',KeyC:'swap',KeyQ:'order',KeyT:'shout',KeyV:'plan',Tab:'plan',KeyZ:'planb'};
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  if(e.repeat&&KEYACT[e.code]){ e.preventDefault(); return; }
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)&&state==='play') e.preventDefault();
  if(state==='play'){
    if(KEYACT[e.code]) doAct(KEYACT[e.code]);
    if(e.code==='KeyP'||e.code==='Escape') pause();
    if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)) inp.mode='kb';
  } else if(state==='pause'&&(e.code==='KeyP'||e.code==='Escape')) resume();
  if(e.code==='KeyM') setMuted(!AU.muted);
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
cv.addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.moved=true; if(!usingTouch) inp.mode='kb'; });
cv.addEventListener('mousedown',e=>{ if(e.button===0){ mouse.down=true; inp.mode='kb'; } if(e.button===2) doAct('grab'); });
addEventListener('mouseup',e=>{ if(e.button===0) mouse.down=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouse.down=false; if(state==='play'&&!(G&&G.net)) pause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play'&&!(G&&G.net)) pause(); });
function touchStart(e){
  e.preventDefault();
  if(!usingTouch){ usingTouch=true; inp.mode='touch'; if(state==='play') setPlayUI(true); }
  audioInit();
  for(const t of e.changedTouches){ const s=t.clientX<VW*0.45?tm:ta; if(s.id===null){ s.id=t.identifier; s.ox=t.clientX; s.oy=t.clientY; s.x=t.clientX; s.y=t.clientY; } }
}
function touchMove(e){
  e.preventDefault();
  for(const t of e.changedTouches){ for(const s of [tm,ta]) if(s.id===t.identifier){ s.x=t.clientX; s.y=t.clientY; const dx=s.x-s.ox, dy=s.y-s.oy, m=Math.hypot(dx,dy); if(m>70){ s.ox=s.x-dx/m*70; s.oy=s.y-dy/m*70; } } }
}
function touchEnd(e){ for(const t of e.changedTouches){ for(const s of [tm,ta]) if(s.id===t.identifier) s.id=null; } }
cv.addEventListener('touchstart',touchStart,{passive:false});
cv.addEventListener('touchmove',touchMove,{passive:false});
cv.addEventListener('touchend',touchEnd); cv.addEventListener('touchcancel',touchEnd);
function btn(id,fn){ $(id).addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); fn(); }); }
btn('bGrab',()=>doAct('grab')); btn('bBuild',()=>doAct('build')); btn('bHop',()=>doAct('hop')); btn('bSwap',()=>doAct('swap')); btn('bOrder',()=>doAct('order')); $('dkStrip').addEventListener('click',e=>{ const b=e.target.closest('button[data-w]'); if(b){ e.stopPropagation(); requestWant(b.dataset.w); } });
$('dkStrip').addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ $('dkStrip').scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
btn('bShout',()=>doAct('shout')); btn('bAbil',()=>doAct('ability')); btn('bUlt',()=>doAct('ult')); btn('bPlan',()=>doAct('plan'));
$('bPause').onclick=()=>pause();
$('bMute').onclick=()=>{ audioInit(); setMuted(!AU.muted); };

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const realDt=Math.min(0.05,(now-last)/1000); last=now;
  try{
    readInput();
    if(G){
      const live=state==='play'||(state==='pause'&&G.net)||((state==='perk'||state==='over')&&G.net&&!G.ended);
      const demoRun=G.demo&&(state==='title'||state==='online'||state==='lobby');
      if(live||demoRun){
        if(G.net==='client'){ clientStep(realDt); clientTick(realDt); }
        else {
          applyLocalInput();
          let ts=1;
          if(G.slow>0){ G.slow-=realDt; ts=0.22; }
          if(G.hitstop>0){ G.hitstop-=realDt; ts=0.05; }
          const dt=realDt*ts;
          /* fixed 60 Hz simulation so frame rate never changes the outcome */
          G.acc=(G.acc||0)+dt; let n=0; while(G.acc>=1/60&&n<5){ step(1/60); G.acc-=1/60; n++; } if(n>=5) G.acc=0;
          if(G.net==='host') hostTick(realDt);
          if(G.ended){
            G.endReal+=realDt;
            if((state==='play'||(state==='pause'&&G.net==='host'))&&G.endReal>2.8){ if(G.net==='host') hostAfterRound(); else showRoundEnd(); }
            else if(demoRun&&G.endReal>3) startDemo();
          }
        }
        if(state==='play'||state==='pause') updHud(realDt);
      } else if(G.net==='client'){ clientTick(realDt); }
    }
    if(NET.role==='client'&&NET.game&&!(G&&G.net==='client')) clientTick(realDt);
    render(realDt);
    if(SPR_DIRTY){ SPR_DIRTY=false; const sc=$('screen'); if(!sc.hidden) paintCanvases(sc); if(G&&!$('padHud').hidden){ const me=G.players[G.mySlot]; if(me) dockArt(G.teams[me.team]); } }
    if(state==='play'||state==='pause') dockFrame();
    if(state==='title') drawArt();
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
resize(); setMuted(AU.muted);
state='loading';
showScreen(`<div class="card loadcard"><div class="logo"><span class="m8">M8M8</span></div><p class="note">Unpacking the tribes…</p><div class="hpbar"><i id="ldBar" style="width:0%;background:#e3b54f"></i></div></div>`);
preloadAssets(()=>{ if(state==='loading') titleScreen(); },f=>{ const b=$('ldBar'); if(b) b.style.width=Math.round(f*100)+'%'; });
netInit();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(G&&G.demo){ G.terrain=buildTerrain(G.seed,G.theme,G.layout,G.zones); } paintCanvases($('screen')); });
requestAnimationFrame(frame);
})();
</script>
